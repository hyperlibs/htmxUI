<!-- 
  Component: progress.html
  Configurable State: themeColor ('primary'|'secondary'|'destructive'), size ('sm'|'md'|'lg'), isOpen (boolean)
  Usage: Bind styles dynamically using hx-class="{ 'bg-primary': themeColor === 'primary' }" or hx-style="{ width: size === 'lg' ? '100%' : 'auto' }"
-->
<div hx-ext="reactive" hx-state="{ themeColor: \'primary\', size: \'md\', isOpen: false }"  class="w-full bg-secondary rounded-full h-2.5">
  <!-- The width determines the progress, managed via backend -->
  <div class="bg-primary h-2.5 rounded-full transition-all" style="width: {percentage}%"></div>
</div>
